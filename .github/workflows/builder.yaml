name: Builder

on:
  push:
    branches: [main]
    paths:
      - "teddy_cloud/**"
      - "teddy_cloud_edge/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "teddy_cloud/**"
      - "teddy_cloud_edge/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  addon:
    name: Build ${{ matrix.addon }}
    strategy:
      fail-fast: false
      matrix:
        addon: [teddy_cloud, teddy_cloud_edge]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build-addon.yaml
    with:
      addon: ${{ matrix.addon }}
